[project]
name = "pollygraph"
version = "0.1.0"
description = "Open database and analysis of Israeli Knesset-26 election polls filed with the Central Elections Committee"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "curl-cffi>=0.7",
    "pdfplumber>=0.11",
    "tzdata>=2026.5",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pollygraph"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
